<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kruz Ctrl</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 10px;
    }
    .logo {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 12px;
    }
    .title { font-weight: 600; font-size: 14px; }
    .subtitle { font-size: 11px; color: #666; }
    .status {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .status.connected { background: #dcfce7; color: #166534; }
    .status.disconnected { background: #fee2e2; color: #991b1b; }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }
    .features { list-style: none; }
    .features li {
      padding: 4px 0;
      font-size: 11px;
      color: #444;
      display: flex; align-items: center; gap: 6px;
    }
    .features li::before {
      content: '✓'; color: #16a34a; font-weight: 700;
    }
    .footer {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid #e5e5e5;
      font-size: 10px; color: #999; text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">K</div>
    <div>
      <div class="title">Kruz Ctrl</div>
      <div class="subtitle">v1.0.0</div>
    </div>
  </div>

  <div id="status" class="status disconnected">
    <div class="dot"></div>
    <span id="status-text">Checking connection…</span>
  </div>

  <ul class="features">
    <li>Bot detection evasion</li>
    <li>Shadow DOM piercing</li>
    <li>Live DOM observation</li>
    <li>Persistent sessions</li>
  </ul>

  <div class="footer">
    Kruz MCP browser extension
  </div>

  <script src="popup.js"></script>
</body>
</html>
