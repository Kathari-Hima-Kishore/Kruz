<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kruz Test Fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; padding-bottom: 140px; }
  .row { margin: 12px 0; }
  #cookieConsent { position: fixed; bottom: 0; left: 0; right: 0; background:#222; color:#fff; padding:12px; z-index: 50; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 999; display: none; }
  #modal.open { display: block; }
</style>
</head>
<body>
  <h1 id="heading">Kruz Fixture Page</h1>
  <p id="intro">This is a local test page for Kruz interactions.</p>

  <div class="row">
    <label>Keyword <input id="kw" placeholder="Search keyword" oninput="window.kwValue = this.value"></label>
  </div>

  <div class="row">
    <label for="loc">Location</label>
    <select id="loc">
      <option value="">All locations</option>
      <option value="blr">Bangalore</option>
      <option value="hyd">Hyderabad</option>
      <option value="pun">Pune</option>
    </select>
  </div>

  <div class="row">
    <button id="searchBtn" onclick="window.clicked = (window.clicked||0)+1; document.getElementById('results').innerHTML='<li>Result '+window.clicked+'</li>'; document.getElementById('status').textContent='Searched '+window.clicked">Search</button>
    <button id="dynamicBtn" onclick="setTimeout(function(){document.getElementById('lazy').textContent='Lazy content arrived';},600)">Load lazy</button>
  </div>

  <div class="row">
    <input type="checkbox" id="agree"><label for="agree">I agree</label>
  </div>

  <div class="row">
    <input type="range" id="radius" min="0" max="100" value="50" oninput="document.getElementById('radiusOut').textContent=this.value">
    <output id="radiusOut">50</output>
  </div>

  <div class="row">
    <button id="confirmBtn" onclick="window.confirmed = confirm('Proceed?')">Confirm dialog</button>
    <button id="modalBtn" onclick="document.getElementById('modal').classList.add('open')">Open modal</button>
  </div>

  <ul id="results"></ul>
  <p id="status">idle</p>
  <p id="lazy">not loaded</p>

  <!-- Shadow-DOM component fixture: controls exist only inside an open shadow root -->
  <div id="shadowHost"></div>

  <!-- Cookie banner (fixed to bottom, does not cover page content) -->
  <div id="cookieConsent" class="cookie-banner" role="dialog" aria-modal="true">
    <span>We use cookies</span>
    <button id="declineCookie" onclick="window.declined=true;this.closest('#cookieConsent').remove()">Decline</button>
    <button id="acceptCookie" onclick="window.accepted=true;this.closest('#cookieConsent').remove()">Accept all</button>
  </div>

  <!-- Blocking modal, opened explicitly by the modal test -->
  <div id="modal" aria-hidden="true">
    <div role="dialog" aria-modal="true" style="background:#fff;margin:15vh auto;padding:24px;width:320px">
      <p>Session expired</p>
      <button id="modalClose" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
    </div>
  </div>

  <div id="longList"></div>
  <script>
    for (let i = 1; i <= 60; i++) {
      const d = document.createElement('div');
      d.className = 'item'; d.id = 'item' + i;
      d.innerHTML = '<a href="https://example.com/job/' + i + '">Job item ' + i + '</a>';
      document.getElementById('longList').appendChild(d);
    }
    // Open shadow root with an input, a button, and a nested value readout.
    const host = document.getElementById('shadowHost');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<label>Shadow keyword <input id="shadowKw" placeholder="shadow input"></label>' +
      '<button id="shadowBtn" onclick="this.textContent=\'Shadow clicked\'">Shadow action</button>' +
      '<span id="shadowOut">shadow idle</span>';
    // Closed shadow root — must remain unreachable (honest failure, not a wrong click).
    const closedHost = document.createElement('div');
    closedHost.id = 'closedHost';
    document.body.appendChild(closedHost);
    closedHost.attachShadow({ mode: 'closed' }).innerHTML = '<button id="closedBtn">Closed action</button>';
    window.selectionLog = [];
  </script>
</body>
</html>
